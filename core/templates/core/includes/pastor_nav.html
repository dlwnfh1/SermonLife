<section class="panel pastor-nav-panel">
    <nav class="pastor-nav" aria-label="교역자 메뉴">
        <a
            class="pastor-nav-link {% if pastor_menu == 'sermon' %}pastor-nav-link-active{% endif %}"
            href="{% if sermon %}{% url 'core:pastor_sermon_edit' sermon.pk %}{% else %}{% url 'core:pastor_dashboard' %}{% endif %}"
        >
            설교 검토
        </a>
        <a
            class="pastor-nav-link {% if pastor_menu == 'reports' %}pastor-nav-link-active{% endif %}"
            href="{% url 'core:pastor_reports' %}"
        >
            리포트
        </a>
        <a
            class="pastor-nav-link {% if pastor_menu == 'members' %}pastor-nav-link-active{% endif %}"
            href="{% url 'core:pastor_members' %}"
            data-members-loading-link
        >
            교인 참여 현황
        </a>
        <a
            class="pastor-nav-link {% if pastor_menu == 'transcript_rules' %}pastor-nav-link-active{% endif %}"
            href="{% url 'core:pastor_transcript_corrections' %}"
        >
            AI 단어 학습 시키기
        </a>
        {% if can_use_audio_transcriber %}
            <a
                class="pastor-nav-link {% if pastor_menu == 'audio_transcriber' %}pastor-nav-link-active{% endif %}"
                href="{% url 'core:pastor_audio_transcriber' %}"
            >
                Transcript 만들기
            </a>
        {% endif %}
    </nav>
</section>

<style>
    .members-page-loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(36, 27, 20, 0.2);
        opacity: 0;
        visibility: hidden;
        transition: opacity 160ms ease, visibility 160ms ease;
    }

    .members-page-loading.is-visible {
        opacity: 1;
        visibility: visible;
    }

    .members-page-loading-card {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 18px 22px;
        border: 1px solid #e3d5c2;
        border-radius: 18px;
        background: #fffaf3;
        box-shadow: 0 18px 45px rgba(71, 47, 26, 0.2);
        color: #2a1b11;
    }

    .members-page-loading-spinner {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        border: 3px solid #e8dac7;
        border-top-color: #9d6336;
        border-radius: 50%;
        animation: members-page-loading-spin 700ms linear infinite;
    }

    @keyframes members-page-loading-spin {
        to { transform: rotate(360deg); }
    }
</style>

<div class="members-page-loading" id="members-page-loading" aria-hidden="true">
    <div class="members-page-loading-card" role="status" aria-live="polite">
        <span class="members-page-loading-spinner" aria-hidden="true"></span>
        <strong>교인 참여 현황을 불러오는 중입니다.</strong>
    </div>
</div>

<script>
    (function () {
        const link = document.querySelector("[data-members-loading-link]");
        const loading = document.getElementById("members-page-loading");

        if (!link || !loading || link.classList.contains("pastor-nav-link-active")) {
            return;
        }

        function resetLoading() {
            loading.classList.remove("is-visible");
            loading.setAttribute("aria-hidden", "true");
            link.removeAttribute("aria-disabled");
            link.style.pointerEvents = "";
        }

        link.addEventListener("click", function (event) {
            if (
                event.defaultPrevented ||
                event.button !== 0 ||
                event.metaKey ||
                event.ctrlKey ||
                event.shiftKey ||
                event.altKey ||
                link.getAttribute("aria-disabled") === "true"
            ) {
                return;
            }

            loading.classList.add("is-visible");
            loading.setAttribute("aria-hidden", "false");
            link.setAttribute("aria-disabled", "true");
            link.style.pointerEvents = "none";
        });

        window.addEventListener("pageshow", resetLoading);
    })();
</script>
